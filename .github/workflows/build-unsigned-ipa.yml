name: Build unsigned IPA

# Mac を持っていなくても、GitHub の macOS ランナーで iOS アプリをビルドし、
# 署名なし .ipa を作るためのワークフロー。
# できた .ipa は SideStore（無料署名）で自分の iPhone に入れる。手順は README 参照。

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 2026-11 初旬、GitHub の macOS ランナーは capacity constraint で
    # ランナーが割り当てられず 15 分で cancel される事例が多発している。
    # 複数のプール（arm64 / Intel）を並行で試し、どれか1つでも
    # ランナーを掴めばビルドが進むようにしている。
    # iOS のデバイス向けビルドはホストが Intel でも問題なく行える。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          # AlarmKit（iOS 26 SDK）には Xcode 26 が必要。
          # Xcode 27 は Apple silicon 専用のため、Intel ランナーでは選ばない。
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild (generate ios project)
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build app (no code signing)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS / Scheme: $SCHEME"
          set -o pipefail
          xcodebuild build \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          # ビルドログの error 行を注釈として出す（公開リポジトリなら認証なしで読める）。
          grep -E "error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          echo "--- error lines above (if any) ---"

      - name: Package unsigned IPA
        run: |
          APP=$(ls -d build/DD/Build/Products/Release-iphoneos/*.app | head -1)
          echo "App: $APP"
          rm -rf Payload Mezami-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Mezami-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Mezami-unsigned-ipa-${{ matrix.os }}
          path: Mezami-unsigned.ipa
